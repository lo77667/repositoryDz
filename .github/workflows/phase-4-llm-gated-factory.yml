name: Phase 8 — hardened LLM provider fallback

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'فترة اختبار بصيغة YYYY-wNN؛ اتركها فارغة لاستخدام الأسبوع الحالي'
        required: false
        type: string
        default: ''
      force_primary_failure:
        description: 'اختبار انتقال السلسلة: عطّل Gemini عمدًا وانتقل إلى Groq'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repositoryDz-publish-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
  LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL || 'gemini-3-flash-preview' }}
  LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL || secrets.LLM_FALLBACK_BASE_URL || 'https://api.groq.com/openai/v1' }}
  LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || secrets.LLM_FALLBACK_MODEL || 'openai/gpt-oss-20b' }}
  LLM_SECONDARY_BASE_URL: ${{ vars.LLM_SECONDARY_BASE_URL || secrets.LLM_SECONDARY_BASE_URL || 'https://api.mistral.ai/v1' }}
  LLM_SECONDARY_MODEL: ${{ vars.LLM_SECONDARY_MODEL || secrets.LLM_SECONDARY_MODEL || 'mistral-small-latest' }}

jobs:
  generate:
    name: Generate through the provider fallback chain and verify safely
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      period: ${{ steps.build.outputs.period }}
      path: ${{ steps.build.outputs.path }}
      url: ${{ steps.build.outputs.url }}
      title: ${{ steps.build.outputs.title }}
      idea_id: ${{ steps.build.outputs.idea_id }}
      mode: ${{ steps.build.outputs.mode }}
      provider: ${{ steps.build.outputs.provider }}
    steps:
      - name: Check out the main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install the isolated browser verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Pick one generate idea
        id: pick
        env:
          WEEKLY_PERIOD: ${{ inputs.period }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WEEKLY_PERIOD:-}" ]]; then
            python3 automation/pick_idea.py --period "${WEEKLY_PERIOD}" --strategy generate
          else
            python3 automation/pick_idea.py --strategy generate
          fi

      - name: Try providers with bounded repairs and shared gates
        id: build
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          LLM_SECONDARY_API_KEY: ${{ secrets.LLM_SECONDARY_API_KEY }}
          PHASE5_FORCE_PRIMARY_FAILURE: ${{ inputs.force_primary_failure }}
          WEEKLY_PERIOD: ${{ steps.pick.outputs.period }}
          SELECTED_IDEA: ${{ steps.pick.outputs.idea_json }}
          CANDIDATE_PATH: products/weekly/${{ steps.pick.outputs.period }}/index.html
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CANDIDATE_PATH}")"
          set +e
          python3 automation/provider_chain.py \
            --idea-json "${SELECTED_IDEA}" \
            --period "${WEEKLY_PERIOD}" \
            --output "${CANDIDATE_PATH}" \
            --max-repairs 2 > /tmp/provider-chain-result.json 2> /tmp/provider-chain-error.log
          chain_status=$?
          set -e
          echo 'Safe provider-chain diagnostic:'
          if [[ -s /tmp/provider-chain-result.json ]]; then
            sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' /tmp/provider-chain-result.json
          fi
          if [[ -s /tmp/provider-chain-error.log ]]; then
            sed -E 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g; s/(LLM_API_KEY=).*/\1[REDACTED]/g' /tmp/provider-chain-error.log
          fi

          if [[ "${chain_status}" -eq 0 ]]; then
            mode='generated'
            chain_provider="$(python3 -c 'import json; print(json.load(open("/tmp/provider-chain-result.json"))["provider"])')"
            echo "Accepted candidate from provider ${chain_provider}."
          else
            echo 'No configured provider produced an accepted candidate; building the safe deterministic fallback.'
            python3 automation/build_fallback_product.py \
              --idea-json "${SELECTED_IDEA}" \
              --period "${WEEKLY_PERIOD}" \
              --output "${CANDIDATE_PATH}"
            mode='fallback'
            chain_provider='deterministic-fallback'
          fi

          python3 automation/validate_generated_html.py "${CANDIDATE_PATH}"
          python3 automation/verify_generated_browser.py "${CANDIDATE_PATH}"
          python3 automation/instrument_analytics.py "${CANDIDATE_PATH}"
          python3 automation/validate_generated_html.py "${CANDIDATE_PATH}" --allow-analytics
          python3 automation/verify_generated_browser.py "${CANDIDATE_PATH}" --allow-analytics
          python3 automation/build_catalog.py
          python3 automation/instrument_analytics.py index.html
          python3 automation/validate_catalog.py index.html
          python3 automation/verify_catalog_browser.py index.html
          url="https://lo77667.github.io/repositoryDz/products/weekly/${WEEKLY_PERIOD}/"
          {
            echo "period=${WEEKLY_PERIOD}"
            echo "path=${CANDIDATE_PATH}"
            echo "url=${url}"
            echo "title=${{ steps.pick.outputs.idea_title }}"
            echo "idea_id=${{ steps.pick.outputs.idea_id }}"
            echo "mode=${mode}"
            echo "provider=${chain_provider}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit and push the accepted artifact and backlog state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "repositoryDz LLM provider chain"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/backlog.json index.html catalog.json "${{ steps.build.outputs.path }}"
          git diff --check
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::main advanced while this run was building; refusing a stale push."
            exit 1
          fi
          git commit -m "chore: publish idea ${{ steps.build.outputs.idea_id }} via ${{ steps.build.outputs.provider }}"
          git push origin HEAD:main

      - name: Wait for the published Pages path
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            '${{ steps.build.outputs.url }}' \
            'https://lo77667.github.io/repositoryDz/'; do
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null "$url"; then
                echo "Published URL is reachable: $url"
                break
              fi
              echo "Pages is still building (attempt $attempt/24): $url"
              sleep 10
            done
            if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null "$url"; then
              echo "::error::The Pages URL did not become reachable in time: $url"
              exit 1
            fi
          done

      - name: Send successful provider-chain notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_PERIOD: ${{ steps.build.outputs.period }}
          PRODUCT_TITLE: ${{ steps.pick.outputs.idea_title }}
          PRODUCT_URL: ${{ steps.build.outputs.url }}
          CATALOG_URL: https://lo77667.github.io/repositoryDz/
          PRODUCT_MODE: ${{ steps.build.outputs.mode }}
          PRODUCT_PROVIDER: ${{ steps.build.outputs.provider }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::Telegram secrets are required for the provider-chain success notification."
            exit 1
          fi
          message="نجح تشغيل مسار LLM المحكوم — ${PRODUCT_PERIOD}\nالفكرة: ${PRODUCT_TITLE}\nالمزود: ${PRODUCT_PROVIDER}\nالنمط: ${PRODUCT_MODE}\nالمنتج: ${PRODUCT_URL}\nالكتالوج: ${CATALOG_URL}"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          grep -q '"ok":true' <<<"${response}"

      - name: Send failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets are unavailable; failure cannot be notified remotely."
            exit 1
          fi
          message="فشل مسار LLM المحكوم؛ لم يتم نشر ناتج غير متحقق منه. راجع السجل:\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          grep -q '"ok":true' <<<"${response}"
