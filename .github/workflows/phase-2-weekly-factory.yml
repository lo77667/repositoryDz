name: Phase 2 — weekly factory heartbeat

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: 'فترة اختبار اختيارية بصيغة YYYY-wNN؛ اتركها فارغة لاستخدام الأسبوع الحالي'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: repositoryDz-publish-main
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    name: Build and publish the weekly Tier A product
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      period: ${{ steps.build.outputs.period }}
      path: ${{ steps.build.outputs.path }}
      url: ${{ steps.build.outputs.url }}
      title: ${{ steps.build.outputs.title }}
      idea_id: ${{ steps.build.outputs.idea_id }}
      strategy: ${{ steps.build.outputs.strategy }}
    steps:
      - name: Check out the main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Pick one backlog idea
        id: pick
        env:
          WEEKLY_PERIOD: ${{ inputs.period }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WEEKLY_PERIOD:-}" ]]; then
            python3 automation/pick_idea.py --period "${WEEKLY_PERIOD}" --strategy-prefix template:
          else
            python3 automation/pick_idea.py --strategy-prefix template:
          fi

      - name: Build the selected deterministic artifact
        id: build
        env:
          WEEKLY_PERIOD: ${{ steps.pick.outputs.period }}
          SELECTED_IDEA: ${{ steps.pick.outputs.idea_json }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/build_weekly_product.py \
            --period "${WEEKLY_PERIOD}" \
            --idea-json "${SELECTED_IDEA}"

      - name: Validate the generated artifact before analytics
        shell: bash
        run: python3 automation/validate_weekly_product.py "${{ steps.build.outputs.path }}"

      - name: Add the trusted page-view pixel
        shell: bash
        run: python3 automation/instrument_analytics.py "${{ steps.build.outputs.path }}"

      - name: Validate the final weekly artifact
        shell: bash
        run: python3 automation/validate_weekly_product.py "${{ steps.build.outputs.path }}" --allow-analytics

      - name: Build and validate the public storefront catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/build_catalog.py
          python3 automation/instrument_analytics.py index.html
          python3 automation/validate_catalog.py index.html
          python3 -m pip install --disable-pip-version-check --no-input --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 automation/verify_catalog_browser.py index.html

      - name: Commit and push the new weekly artifact and backlog state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "repositoryDz weekly factory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/backlog.json index.html catalog.json "${{ steps.build.outputs.path }}"
          git diff --check
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::main advanced while this run was building; refusing a stale push."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No backlog or artifact changes detected."
          else
            git commit -m "chore: publish ${{ steps.build.outputs.idea_id }} for ${{ steps.build.outputs.period }}"
            git push origin HEAD:main
          fi

      - name: Wait for the published Pages path
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            '${{ steps.build.outputs.url }}' \
            'https://lo77667.github.io/repositoryDz/'; do
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null "$url"; then
                echo "Published URL is reachable: $url"
                break
              fi
              echo "Pages is still building (attempt $attempt/18): $url"
              sleep 10
            done
            if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null "$url"; then
              echo "::error::The Pages URL did not become reachable in time: $url"
              exit 1
            fi
          done

      - name: Send successful weekly notification
        if: ${{ success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT_PERIOD: ${{ steps.build.outputs.period }}
          PRODUCT_TITLE: ${{ steps.build.outputs.title }}
          PRODUCT_URL: ${{ steps.build.outputs.url }}
          CATALOG_URL: https://lo77667.github.io/repositoryDz/
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "::error::Telegram secrets are required for the weekly success notification."
            exit 1
          fi
          message="نجح تشغيل المصنع الأسبوعي — ${PRODUCT_PERIOD}\n${PRODUCT_TITLE}\n${PRODUCT_URL}\nالكتالوج: ${CATALOG_URL}"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          grep -q '"ok":true' <<<"${response}"

      - name: Send failure notification
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram secrets are unavailable; failure cannot be notified remotely."
            exit 1
          fi
          message="فشل تشغيل المصنع الأسبوعي — راجع السجل:\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          response="$(curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}")"
          grep -q '"ok":true' <<<"${response}"
