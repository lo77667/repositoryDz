<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20152c">
  <title>لعبة بصرية — منتج أسبوعي</title>
  <style>
    :root{color-scheme:dark;--bg:#120e1b;--panel:#21162f;--line:#49355f;--text:#fff7ff;--muted:#c8b5d2;--accent:#f3a7ff;--accent2:#ffd68a}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 18% 0,#4e2a57 0,transparent 31rem),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7}.shell{width:min(1020px,calc(100% - 30px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:24px 0 46px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:14px;background:linear-gradient(140deg,var(--accent),var(--accent2));color:#23142c;font-weight:900;font-size:1.3rem}.brand b{display:block}.brand small{color:var(--muted)}.badge{border:1px solid #694c79;border-radius:99px;color:var(--accent2);padding:5px 11px;font-size:.75rem}.hero{max-width:700px;margin-bottom:20px}.eyebrow{color:var(--accent);font-size:.8rem;font-weight:800;margin:0 0 9px}h1{font-size:clamp(2rem,5vw,4rem);line-height:1.16;letter-spacing:-.04em;margin:0}p{color:var(--muted)}.stage{display:grid;grid-template-columns:1fr .8fr;gap:16px}.card{background:rgba(33,22,47,.9);border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 22px 70px #0006}.visual{min-height:390px;display:grid;place-items:center;overflow:hidden;position:relative;background:linear-gradient(145deg,#292244,#1d1831)}.orb{width:170px;height:170px;border-radius:52% 48% 63% 37%;background:linear-gradient(145deg,var(--accent),#886cff);box-shadow:0 0 80px var(--accent);transform:rotate(12deg);transition:transform .4s ease,filter .4s ease,background .4s ease}.orb::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.2);transform:translate(-35px,-28px)}.star{position:absolute;font-size:1.2rem;color:var(--accent2);transition:transform .4s ease}.star.one{top:22%;right:22%}.star.two{bottom:23%;left:21%;font-size:.9rem}.controls{display:grid;gap:16px}.choice{display:flex;flex-wrap:wrap;gap:8px}.choice button,.primary{border:1px solid var(--line);background:#2e2140;color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer;font:inherit}.choice button.active,.primary{background:var(--accent);color:#21162f;border-color:transparent;font-weight:800}.choice button:focus-visible,.primary:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}.control-row{display:grid;gap:8px}.control-row label{font-size:.85rem;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.readout{padding:14px;border:1px solid var(--line);border-radius:14px;color:#fff0ff;font-size:.9rem}.footer{padding:30px 0;color:var(--muted);font-size:.75rem;border-top:1px solid var(--line);margin-top:50px}@media(max-width:720px){.stage{grid-template-columns:1fr}.top{padding-bottom:30px}.card{padding:19px}.visual{min-height:300px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand"><span class="mark">✦</span><span><b id="brand-title">لعبة بصرية</b><small>تجربة قصيرة تعمل محليًا</small></span></div><span class="badge">لا حساب مطلوب</span></header>
    <main><section class="hero"><p class="eyebrow">قالب التجربة البصرية — المرحلة 3</p><h1 id="idea-title">اصنع مزاجًا بصريًا في لحظة.</h1><p id="idea-pitch">اختر شعورًا وعدّل الشدة، ثم راقب المشهد يتغير أمامك.</p></section>
      <section class="stage" aria-label="لعبة المزاج البصري"><article class="card visual" id="visual-stage"><span class="star one">✦</span><span class="star two">✧</span><div class="orb" id="orb" aria-hidden="true"></div></article>
      <article class="card controls"><p class="eyebrow">لوحة التحكم</p><div class="control-row"><label>المزاج</label><div class="choice" role="group" aria-label="اختيار المزاج"><button type="button" class="mood active" data-mood="هدوء">هدوء</button><button type="button" class="mood" data-mood="طاقة">طاقة</button><button type="button" class="mood" data-mood="دفء">دفء</button></div></div><div class="control-row"><label for="intensity">الشدة: <output id="intensity-value">55</output>%</label><input id="intensity" type="range" min="10" max="100" value="55"></div><button class="primary" id="shuffle" type="button">غيّر المشهد</button><div class="readout" id="readout" aria-live="polite">المشهد الحالي: هدوء بشدة 55%</div></article></section>
    </main><footer class="footer">نسخة ثابتة من مصنع المنتجات — <span id="period-label">فترة أسبوعية</span></footer>
  </div>
  <script>
    (() => {
      "use strict";
      const idea = window.__WEEKLY_IDEA__ || { title: "لعبة بصرية", pitch: "تجربة مزاجية قصيرة.", format: "لعبة بصرية" };
      document.querySelector("#idea-title").textContent = idea.title;
      document.querySelector("#idea-pitch").textContent = `${idea.pitch} ${idea.differentiator || ""}`.trim();
      document.querySelector("#brand-title").textContent = idea.format;
      const stage = document.querySelector("#visual-stage");
      const orb = document.querySelector("#orb");
      const slider = document.querySelector("#intensity");
      const output = document.querySelector("#intensity-value");
      const readout = document.querySelector("#readout");
      const moods = { "هدوء": ["#9cc8ff", "#6d66db"], "طاقة": ["#ff8aaf", "#ffbd58"], "دفء": ["#ffd08a", "#e77d91"] };
      let mood = "هدوء";
      const render = () => {
        const intensity = Number(slider.value);
        const colors = moods[mood];
        const scale = 0.75 + intensity / 180;
        orb.style.background = `linear-gradient(145deg, ${colors[0]}, ${colors[1]})`;
        orb.style.transform = `rotate(${intensity / 3}deg) scale(${scale})`;
        orb.style.filter = `saturate(${0.7 + intensity / 90})`;
        output.value = intensity;
        output.textContent = intensity;
        readout.textContent = `المشهد الحالي: ${mood} بشدة ${intensity}%`;
      };
      document.querySelectorAll(".mood").forEach((button) => button.addEventListener("click", () => {
        mood = button.dataset.mood;
        document.querySelectorAll(".mood").forEach((item) => item.classList.toggle("active", item === button));
        render();
      }));
      slider.addEventListener("input", render);
      document.querySelector("#shuffle").addEventListener("click", () => {
        slider.value = String(20 + Math.floor(Math.random() * 81));
        const buttons = [...document.querySelectorAll(".mood")];
        buttons[Math.floor(Math.random() * buttons.length)].click();
      });
      render();
    })();
  </script>
</body>
</html>
