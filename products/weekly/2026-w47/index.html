<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>موضح سياسة الشحن</title><style>body{font-family:system-ui,-apple-system,sans-serif;background-color:#f4f7f9;color:#333;margin:0;padding:20px;line-height:1.6}#app{max-width:800px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}header{text-align:center;margin-bottom:30px}h1{color:#2c3e50;margin-bottom:10px}p.description{color:#666;font-size:0.95rem}textarea{width:100%;height:180px;padding:15px;border:2px solid #e0e0e0;border-radius:8px;font-size:1rem;resize:vertical;box-sizing:border-box;margin-bottom:20px;transition:border-color 0.3s}textarea:focus{outline:none;border-color:#3498db}button{display:block;width:100%;padding:15px;background-color:#3498db;color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:background-color 0.3s}button:hover{background-color:#2980b9}#result{margin-top:30px;display:none;border-top:2px solid #eee;padding-top:20px}#result.active{display:block}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}.card{background:#f9f9f9;padding:15px;border-radius:8px;border-right:4px solid #3498db}.card h3{margin:0 0 10px 0;font-size:0.9rem;color:#7f8c8d;text-transform:uppercase}.card p{margin:0;font-weight:bold;color:#2c3e50;font-size:1.1rem}.highlight{color:#e67e22}.empty-state{text-align:center;color:#999;padding:20px}</style></head><body><div id="app"><header><h1>موضح سياسة الشحن</h1><p class="description">حوّل نصوص سياسة الشحن الطويلة والمعقدة إلى نقاط واضحة لعملائك. الصق النص أدناه لاستخراج المعلومات الأساسية.</p></header><main><textarea id="policyInput" placeholder="مثال: نحن نوفر شحن مجاني للطلبات فوق 200 ريال. يستغرق التوصيل عادة من 3 إلى 5 أيام عمل. يمكنكم إرجاع المنتجات خلال 14 يوم من تاريخ الاستلام..."></textarea><button id="processBtn" data-factory-action="primary">تحليل وتبسيط السياسة</button><div id="result" aria-live="polite"><h2 style="font-size:1.2rem;margin-bottom:15px">ملخص السياسة المستخرج:</h2><div class="summary-grid" id="summaryGrid"></div><div id="rawSummary" style="margin-top:20px;padding:15px;background:#fff8e1;border-radius:8px;font-size:0.9rem;color:#856404;display:none"></div></div></main></div><script>const processBtn=document.getElementById('processBtn');const policyInput=document.getElementById('policyInput');const resultArea=document.getElementById('result');const summaryGrid=document.getElementById('summaryGrid');const rawSummary=document.getElementById('rawSummary');function extractInfo(text){const info={deliveryTime:null,shippingCost:null,returnPeriod:null,coverage:null};const deliveryMatch=text.match(/(\d+)\s*(إلى|-|\s)\s*(\d+)\s*(أيام|يوم|عمل)/);if(deliveryMatch)info.deliveryTime=`${deliveryMatch[1]} - ${deliveryMatch[3]} أيام عمل`;else{const singleDayMatch=text.match(/(\d+)\s*(أيام|يوم)/);if(singleDayMatch)info.deliveryTime=singleDayMatch[0]}if(text.includes('مجاني'))info.shippingCost='شحن مجاني';const costMatch=text.match(/(\d+)\s*(ريال|درهم|جنيه|\$)/);if(costMatch&&!info.shippingCost)info.shippingCost=costMatch[0];const returnMatch=text.match(/(\d+)\s*(يوم|أيام)\s*(للإرجاع|للاسترجاع|إرجاع|استبدال)/);if(returnMatch)info.returnPeriod=returnMatch[1]+' يوم';else{const returnMatchAlt=text.match(/(إرجاع|استبدال)\s*خلال\s*(\d+)/);if(returnMatchAlt)info.returnPeriod=returnMatchAlt[2]+' يوم'}if(text.includes('جميع أنحاء'))info.coverage='تغطية شاملة';else if(text.includes('مدن مختارة'))info.coverage='مدن محددة';return info}processBtn.addEventListener('click',()=>{const text=policyInput.value.trim();if(!text){alert('يرجى إدخال نص السياسة أولاً');return}const data=extractInfo(text);summaryGrid.innerHTML='';const fields=[{label:'مدة التوصيل',value:data.deliveryTime,icon:'🚚'},{label:'تكلفة الشحن',value:data.shippingCost,icon:'💰'},{label:'فترة الإرجاع',value:data.returnPeriod,icon:'🔄'},{label:'مناطق التغطية',value:data.coverage,icon:'📍'}];let foundAny=false;fields.forEach(field=>{if(field.value){foundAny=true;const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>${field.icon} ${field.label}</h3><p>${field.value}</p>`;summaryGrid.appendChild(card)}});if(!foundAny){summaryGrid.innerHTML='<div class="empty-state">لم نتمكن من استخراج بيانات محددة تلقائياً. يرجى التأكد من ذكر الأرقام والمدد بوضوح.</div>';rawSummary.style.display='block';rawSummary.innerText='نصيحة: حاول ذكر عبارات مثل "3 أيام" أو "شحن مجاني" أو "إرجاع خلال 14 يوم"'}else{rawSummary.style.display='none'}resultArea.classList.add('active');resultArea.scrollIntoView({behavior:'smooth'})});</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w47" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
