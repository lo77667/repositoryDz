<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مرتب أسباب الاسترجاع</title><style>body{font-family:system-ui,-apple-system,sans-serif;background-color:#f4f7f9;color:#333;margin:0;padding:20px;line-height:1.6}#app{max-width:800px;margin:0 auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.05)}.header{text-align:center;margin-bottom:30px}.header h1{color:#2c3e50;margin-bottom:10px}.header p{color:#666;font-size:0.95rem}textarea{width:100%;height:150px;padding:12px;border:2px solid #e0e0e0;border-radius:8px;resize:vertical;font-size:1rem;box-sizing:border-box;margin-bottom:20px;transition:border-color 0.3s}textarea:focus{outline:none;border-color:#3498db}.btn-container{text-align:center}.btn-primary{background-color:#3498db;color:#fff;border:none;padding:12px 30px;font-size:1.1rem;border-radius:8px;cursor:pointer;transition:background 0.3s;font-weight:bold}.btn-primary:hover{background-color:#2980b9}.results{margin-top:30px;display:none}.results h2{font-size:1.2rem;border-bottom:2px solid #eee;padding-bottom:10px;margin-bottom:20px}.stat-card{background:#f9f9f9;border-right:4px solid #3498db;padding:15px;margin-bottom:10px;border-radius:4px;display:flex;justify-content:space-between;align-items:center}.stat-label{font-weight:600}.stat-count{background:#3498db;color:#fff;padding:2px 10px;border-radius:20px;font-size:0.85rem}.bar-container{height:8px;background:#eee;border-radius:4px;margin-top:8px;overflow:hidden}.bar-fill{height:100%;background:#3498db;width:0%}.empty-state{text-align:center;color:#999;margin-top:20px}</style></head><body><div id="app"><div class="header"><h1>مرتب أسباب الاسترجاع</h1><p>قم بلصق ملاحظات العملاء أو أسباب الاسترجاع (كل سبب في سطر منفصل) لتحليل الأنماط المتكررة.</p></div><textarea id="inputData" placeholder="مثال:
المقاس صغير جداً
تأخر التوصيل
المنتج تالف
المقاس صغير جداً
جودة القماش ضعيفة"></textarea><div class="btn-container"><button id="analyzeBtn" class="btn-primary" data-factory-action="primary">تحليل البيانات</button></div><div id="resultsArea" class="results"><h2>نتائج التحليل</h2><div id="statsContainer"></div></div><div id="emptyMsg" class="empty-state">أدخل البيانات أعلاه للبدء في التحليل.</div></div><script>document.getElementById('analyzeBtn').addEventListener('click', function() {const text = document.getElementById('inputData').value.trim();const resultsArea = document.getElementById('resultsArea');const statsContainer = document.getElementById('statsContainer');const emptyMsg = document.getElementById('emptyMsg');if (!text) {alert('يرجى إدخال بعض البيانات أولاً');return;}const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);const counts = {};lines.forEach(line => {counts[line] = (counts[line] || 0) + 1;});const sortedEntries = Object.entries(counts).sort((a, b) => b[1] - a[1]);const maxCount = sortedEntries[0][1];statsContainer.innerHTML = '';sortedEntries.forEach(([reason, count]) => {const percentage = (count / maxCount) * 100;const card = document.createElement('div');card.className = 'stat-card-wrapper';card.innerHTML = `<div class="stat-card"><span class="stat-label">${reason}</span><span class="stat-count">${count} تكرار</span></div><div class="bar-container"><div class="bar-fill" style="width: ${percentage}%"></div></div><div style="margin-bottom:15px;"></div>`;statsContainer.appendChild(card);});resultsArea.style.display = 'block';emptyMsg.style.display = 'none';resultsArea.scrollIntoView({ behavior: 'smooth' });});</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w45" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
