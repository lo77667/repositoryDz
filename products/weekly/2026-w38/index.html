<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ناقد صفحة الدفع</title><style>body{font-family:system-ui,-apple-system,sans-serif;background-color:#f4f7f6;color:#333;margin:0;padding:20px;line-height:1.6}#app{max-width:600px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}.header{text-align:center;margin-bottom:30px}.header h1{color:#2c3e50;margin-bottom:10px}.header p{color:#7f8c8d;font-size:0.95rem}.checklist{margin-bottom:30px}.item{display:flex;align-items:center;padding:12px;border-bottom:1px solid #eee;transition:background 0.2s}.item:hover{background:#fcfcfc}.item input[type="checkbox"]{width:20px;height:20px;margin-left:15px;cursor:pointer}.item label{cursor:pointer;flex-grow:1;font-weight:500}.btn-primary{display:block;width:100%;padding:15px;background-color:#27ae60;color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:background 0.3s}.btn-primary:hover{background-color:#219150}.result-area{margin-top:30px;padding:20px;border-radius:8px;display:none;text-align:center}.score-circle{width:80px;height:80px;border-radius:50%;background:#27ae60;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;margin:0 auto 15px}.feedback-list{text-align:right;margin-top:15px;padding:0;list-style:none}.feedback-list li{margin-bottom:8px;padding-right:20px;position:relative}.feedback-list li::before{content:"•";position:absolute;right:0;color:#e67e22;font-weight:bold}.status-bad{background-color:#fdeaea;border:1px solid #f5c6cb}.status-good{background-color:#eafaf1;border:1px solid #d4edda}</style></head><body><div id="app"><div class="header"><h1>ناقد صفحة الدفع</h1><p>راجع جودة صفحة الدفع في متجرك قبل الإطلاق لزيادة المبيعات.</p></div><div class="checklist"><div class="item"><input type="checkbox" id="c1" data-weight="20"><label for="c1">هل تكاليف الشحن واضحة تماماً قبل إدخال بيانات الدفع؟</label></div><div class="item"><input type="checkbox" id="c2" data-weight="20"><label for="c2">هل توفر خيار "الشراء كضيف" دون إجبار العميل على التسجيل؟</label></div><div class="item"><input type="checkbox" id="c3" data-weight="15"><label for="c3">هل عدد الحقول المطلوبة قليل (الاسم، العنوان، الهاتف فقط)؟</label></div><div class="item"><input type="checkbox" id="c4" data-weight="15"><label for="c4">هل تظهر شعارات الأمان (SSL) ووسائل الدفع الموثوقة بوضوح؟</label></div><div class="item"><input type="checkbox" id="c5" data-weight="10"><label for="c5">هل الصفحة متوافقة تماماً مع شاشات الجوال؟</label></div><div class="item"><input type="checkbox" id="c6" data-weight="10"><label for="c6">هل يوجد شريط تقدم يوضح للعميل مكانه الحالي في عملية الدفع؟</label></div><div class="item"><input type="checkbox" id="c7" data-weight="10"><label for="c7">هل تظهر رسائل الخطأ بشكل واضح وفوري عند إدخال بيانات خاطئة؟</label></div></div><button class="btn-primary" data-factory-action="primary" onclick="analyzeCheckout()">تحليل صفحة الدفع</button><div id="result" class="result-area"><div class="score-circle" id="scoreDisplay">0%</div><h3 id="statusTitle"></h3><p id="statusDesc"></p><ul id="feedbackList" class="feedback-list"></ul></div></div><script>function analyzeCheckout(){const checkboxes=document.querySelectorAll('.checklist input[type="checkbox"]');let score=0;let missing=[];checkboxes.forEach(cb=>{if(cb.checked){score+=parseInt(cb.dataset.weight)}else{missing.push(cb.nextElementSibling.innerText)}});const resultArea=document.getElementById('result');const scoreDisplay=document.getElementById('scoreDisplay');const statusTitle=document.getElementById('statusTitle');const statusDesc=document.getElementById('statusDesc');const feedbackList=document.getElementById('feedbackList');resultArea.style.display='block';scoreDisplay.innerText=score+'%';feedbackList.innerHTML='';if(score>=90){resultArea.className='result-area status-good';statusTitle.innerText='ممتاز!';statusDesc.innerText='صفحة الدفع لديك جاهزة تماماً وتتبع أفضل الممارسات.';}else if(score>=60){resultArea.className='result-area status-good';statusTitle.innerText='جيد جداً';statusDesc.innerText='لديك أساس قوي، ولكن هناك بعض التحسينات الممكنة لزيادة التحويل.';}else{resultArea.className='result-area status-bad';statusTitle.innerText='تحتاج إلى تحسين';statusDesc.innerText='هناك نقاط حرجة قد تسبب نفور العملاء من إتمام الشراء.';}if(missing.length>0){const tipHeader=document.createElement('strong');tipHeader.innerText='نصائح للتحسين:';feedbackList.appendChild(tipHeader);missing.forEach(item=>{const li=document.createElement('li');li.innerText=item;feedbackList.appendChild(li)})}window.scrollTo({top:resultArea.offsetTop,behavior:'smooth'})}</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w38" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
