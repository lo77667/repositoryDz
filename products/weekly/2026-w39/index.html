<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>مفسر سياسة الاسترجاع</title><style>body{background-color:#f0f2f5;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;padding:20px;direction:rtl;margin:0}.container{max-width:500px;width:100%;background:white;padding:25px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.05);margin-top:20px}h1{font-size:1.4rem;color:#1a73e8;margin:0 0 10px 0}p{color:#5f6368;font-size:0.9rem;margin-bottom:20px;line-height:1.5}textarea{width:100%;height:140px;border:2px solid #e8eaed;border-radius:10px;padding:12px;box-sizing:border-box;margin-bottom:15px;font-size:14px;resize:none;font-family:inherit}textarea:focus{outline:none;border-color:#1a73e8}button{background:#1a73e8;color:white;border:none;padding:14px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1rem;transition:background 0.2s}button:hover{background:#1765cc}.result-box{margin-top:25px;display:none;border-top:1px solid #e8eaed;padding-top:20px}.item{display:flex;justify-content:space-between;margin-bottom:12px;padding:12px;background:#f8f9fa;border-radius:8px;align-items:center}.label{color:#5f6368;font-size:0.85rem}.value{font-weight:bold;color:#202124;font-size:0.95rem}footer{margin-top:25px;text-align:center;font-size:0.75rem;color:#9aa0a6}</style></head><body><div class="container"><h1>مفسر سياسة الاسترجاع</h1><p>أداة ذكية لتحويل نصوص سياسات الاسترجاع الطويلة والمعقدة إلى نقاط واضحة ومختصرة تساعدك قبل الشراء.</p><textarea id="policyInput" placeholder="الصق نص سياسة الاسترجاع هنا... مثال: يمكن إرجاع المنتج خلال 14 يوماً من تاريخ الاستلام بشرط أن يكون في حالته الأصلية وتغليفه الأصلي..."></textarea><button data-factory-action="primary">تحليل السياسة</button><div id="resultArea" class="result-box" aria-live="polite"><h3>ملخص التحليل:</h3><div class="item"><span class="label">فترة الاسترجاع المتاحة:</span><span id="resDays" class="value">-</span></div><div class="item"><span class="label">تكاليف شحن الإرجاع:</span><span id="resShipping" class="value">-</span></div><div class="item"><span class="label">طريقة استرداد الأموال:</span><span id="resRefund" class="value">-</span></div><div class="item"><span class="label">شرط حالة المنتج:</span><span id="resCond" class="value">-</span></div></div><footer>إصدار 2026-w39 • أداة محلية وآمنة</footer></div><script>function analyze(){const t=document.getElementById('policyInput').value;if(!t.trim())return;const d=t.match(/(\d+)\s*(يوم|أيام|day)/i);const s=/(مجاني|free|بدون رسوم|على المتجر|نتحمل)/i.test(t);const r=/(نقدي|cash|بنكي|بطاقة|فلوس|استرداد|رصيد)/i.test(t);const c=/(تغليف|أصلي|original|tags|حالة|كرتون)/i.test(t);document.getElementById('resDays').innerText=d?d[1]+' يوم':'غير محدد بوضوح';document.getElementById('resShipping').innerText=s?'شحن مجاني':'يتحملها العميل غالباً';document.getElementById('resRefund').innerText=r?'استرداد مالي / رصيد':'غير محدد';document.getElementById('resCond').innerText=c?'يشترط التغليف والحالة الأصلية':'شروط عامة';document.getElementById('resultArea').style.display='block'}document.querySelector('[data-factory-action="primary"]').addEventListener('click', analyze);</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w39" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
