<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مخطط إعادة الضبط</title><style>body { font-family: system-ui, -apple-system, sans-serif; background-color: #f0f4f8; color: #2d3748; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; } .container { background-color: #ffffff; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); max-width: 500px; width: 100%; } h1 { color: #2c5282; text-align: center; margin-bottom: 0.5rem; } p.description { text-align: center; color: #4a5568; margin-bottom: 1.5rem; font-size: 0.95rem; } .form-group { margin-bottom: 1.5rem; } label { display: block; margin-bottom: 0.5rem; font-weight: bold; } select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e0; border-radius: 0.5rem; background-color: #fff; font-size: 1rem; } button { width: 100%; padding: 1rem; background-color: #4299e1; color: white; border: none; border-radius: 0.5rem; font-size: 1.1rem; cursor: pointer; transition: background-color 0.2s; } button:hover { background-color: #3182ce; } #result { margin-top: 2rem; padding: 1rem; border-radius: 0.5rem; background-color: #ebf8ff; display: none; } .plan-item { display: flex; align-items: flex-start; margin-bottom: 0.75rem; } .plan-item span.icon { margin-left: 0.75rem; font-size: 1.2rem; } .plan-item div { line-height: 1.4; } .hidden { display: none; }</style></head><body><div class="container"><h1>مخطط إعادة الضبط</h1><p class="description">أداة بسيطة لمساعدتك على استعادة تركيزك وتجديد طاقتك بعد جلسات العمل الطويلة.</p><div class="form-group"><label for="fatigue-type">بماذا تشعر الآن؟</label><select id="fatigue-type"><option value="mental">إرهاق ذهني وتشتت</option><option value="physical">توتر جسدي وتصلب</option><option value="eye">إجهاد في العينين</option><option value="creative">انغلاق إبداعي</option></select></div><button id="generate-btn" data-factory-action="primary">إنشاء خطة إعادة الضبط</button><div id="result" aria-live="polite"><h2 style="font-size: 1.2rem; margin-top: 0;">خطتك المقترحة (10 دقائق):</h2><div id="plan-content"></div></div></div><script>document.addEventListener('DOMContentLoaded', function() { const generateBtn = document.getElementById('generate-btn'); const resultDiv = document.getElementById('result'); const planContent = document.getElementById('plan-content'); const fatigueSelect = document.getElementById('fatigue-type'); const plans = { mental: [ { icon: '🧘', text: 'أغمض عينيك وخذ 5 أنفاس عميقة (شهيق من الأنف، زفير بطيء من الفم).' }, { icon: '💧', text: 'اشرب كوباً كاملاً من الماء ببطء.' }, { icon: '🔇', text: 'ابتعد عن أي شاشة لمدة 3 دقائق في صمت تام.' } ], physical: [ { icon: '🚶', text: 'قم بالمشي في الغرفة لمدة دقيقتين.' }, { icon: '🙆', text: 'قم بتمارين تمدد للرقبة والكتفين.' }, { icon: '👐', text: 'افتح وأغلق قبضتي يديك بقوة لتنشيط الدورة الدموية.' } ], eye: [ { icon: '👁️', text: 'طبق قاعدة 20-20-20: انظر لشيء يبعد 20 قدماً لمدة 20 ثانية.' }, { icon: '💦', text: 'اغسل وجهك بماء بارد.' }, { icon: '🌑', text: 'غطِّ عينيك بكفي يديك لمدة دقيقة لتوفير ظلام تام.' } ], creative: [ { icon: '📝', text: 'ارسم خربشات عشوائية على ورقة لمدة دقيقتين دون تفكير.' }, { icon: '🎵', text: 'استمع لمقطوعة موسيقية هادئة أو صوت طبيعة.' }, { icon: '🪟', text: 'انظر من النافذة وحاول رصد 3 أشياء لم تلاحظها من قبل.' } ] }; generateBtn.addEventListener('click', function() { const type = fatigueSelect.value; const selectedPlan = plans[type]; planContent.innerHTML = ''; selectedPlan.forEach(item => { const itemDiv = document.createElement('div'); itemDiv.className = 'plan-item'; itemDiv.innerHTML = '<span class="icon">' + item.icon + '</span><div>' + item.text + '</div>'; planContent.appendChild(itemDiv); }); resultDiv.style.display = 'block'; resultDiv.scrollIntoView({ behavior: 'smooth' }); }); });</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w50" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
