<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>لعبة نبرة العلامة</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f9f9f9;color:#333;}h1{font-size:1.8em;margin-bottom:0.5em;}p{margin-bottom:1em;} .cards{display:flex;gap:10px;margin-bottom:1em;} .card{background:#fff;border:1px solid #ccc;border-radius:5px;padding:10px;cursor:pointer;flex:1;text-align:center;} .card.selected{border-color:#007bff;background:#e7f1ff;} #result{padding:10px;background:#fff;border:1px solid #ccc;border-radius:5px;margin-top:1em;} button{padding:10px 20px;font-size:1em;border:none;border-radius:5px;background:#007bff;color:#fff;cursor:pointer;} button.secondary{background:#6c757d;}</style></head><body><h1>لعبة نبرة العلامة</h1><p>اختيار نبرة مناسبة لرسالة تسويقية. اختر بطاقة واحدة ثم اضغط على زر الاختيار.</p><div class="cards" id="cards"><div class="card" data-value="متحمس">متحمس</div><div class="card" data-value="متحفظ">متحفظ</div><div class="card" data-value="متحمس ومتواضع">متحمس ومتواضع</div><div class="card" data-value="متحفظ ومتحمس">متحفظ ومتحمس</div><div class="card" data-value="متحمس ومتحفظ">متحمس ومتحفظ</div></div><button data-factory-action="primary" id="selectBtn">اختيار النبرة</button><button class="secondary" id="resetBtn">إعادة تعيين</button><div id="result" aria-live="polite"></div><script>(function(){const cards=document.querySelectorAll('.card');let selected=null;cards.forEach(card=>{card.addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));card.classList.add('selected');selected=card.dataset.value;});});document.getElementById('selectBtn').addEventListener('click',()=>{const result=document.getElementById('result');if(selected){result.textContent='النبرة المختارة: '+selected;}else{result.textContent='لم يتم اختيار أي نبرة.';}});document.getElementById('resetBtn').addEventListener('click',()=>{cards.forEach(c=>c.classList.remove('selected'));selected=null;document.getElementById('result').textContent='';});})();</script>  <img data-factory-analytics="counterapi" src="https://counterapi.com/pixel.gif?ns=lo77667.github.io%2FrepositoryDz&amp;action=view&amp;key=weekly-2026-w49" width="1" height="1" alt="" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
</body></html>
